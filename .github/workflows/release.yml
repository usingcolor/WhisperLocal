name: Release
# Optional repository secrets for notarized releases:
# APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD, APPLE_TEAM_ID,
# APPLE_API_KEY_ID, APPLE_API_ISSUER, and APPLE_API_KEY_P8.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure optional Developer ID signing
        id: signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          required=(
            APPLE_DEVELOPER_ID_P12_BASE64
            APPLE_DEVELOPER_ID_P12_PASSWORD
            APPLE_TEAM_ID
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_API_KEY_P8
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Developer ID signing disabled; missing secrets: ${missing[*]}"
            echo "### Release signing" >> "$GITHUB_STEP_SUMMARY"
            echo "Built with the ad-hoc fallback because one or more Apple secrets were unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/whisperlocal-signing.keychain-db"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$identity" ]]; then
            echo "error: the p12 does not contain a Developer ID Application identity." >&2
            exit 1
          fi

          echo "enabled=1" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"
          echo "### Release signing" >> "$GITHUB_STEP_SUMMARY"
          echo "Built with Developer ID signing, Apple notarization, and stapling." >> "$GITHUB_STEP_SUMMARY"

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          CODESIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain_path }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: ${{ steps.signing.outputs.enabled }}
          NOTARYTOOL_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          NOTARYTOOL_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/make-dmg.sh

      - name: Checksum DMG
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperLocal-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
        run: |
          if [[ -n "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$CERTIFICATE_PATH"
          if [[ -n "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi

      - name: Publish GitHub Release
        if: github.repository == 'usingcolor/WhisperLocal' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          gh release create "$tag" dist/*.dmg dist/SHA256SUMS \
            --title "WhisperLocal ${version}" \
            --notes-file .github/release-notes.md
