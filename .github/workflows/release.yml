name: Release
# Optional repository secrets for notarized releases:
# APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD, APPLE_TEAM_ID,
# APPLE_API_KEY_ID, APPLE_API_ISSUER, and APPLE_API_KEY_P8.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure optional Developer ID signing
        id: signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          required=(
            APPLE_DEVELOPER_ID_P12_BASE64
            APPLE_DEVELOPER_ID_P12_PASSWORD
            APPLE_TEAM_ID
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_API_KEY_P8
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "::warning::UNSIGNED RELEASE: ad-hoc only, not notarized. Gatekeeper will block first launch. Missing secrets: ${missing[*]}"
            {
              echo "### ⚠️ Release signing: AD-HOC (not notarized)"
              echo
              echo "This DMG is **ad-hoc signed**. macOS will block the first launch and users"
              echo "must approve it under System Settings → Privacy & Security."
              echo
              echo "Missing secrets: \`${missing[*]}\`"
              echo
              echo "The release notes published with this build say so. To ship notarized"
              echo "builds instead, add all six secrets and re-tag — no code changes needed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/whisperlocal-signing.keychain-db"
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          APPLE_API_KEY_ID="$(tr -d '[:space:]' <<<"$APPLE_API_KEY_ID")"
          APPLE_API_ISSUER="$(tr -d '[:space:]' <<<"$APPLE_API_ISSUER")"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          # Xcode looks at the default keychain and the user search list, not
          # an explicit --keychain flag, when it resolves SPM package signing.
          search_list=("$keychain_path")
          while IFS= read -r line; do
            chain="${line#\"}"
            chain="${chain%\"}"
            chain="${chain#"${chain%%[![:space:]]*}"}"
            if [[ -n "$chain" && "$chain" != "$keychain_path" ]]; then
              search_list+=("$chain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          security default-keychain -d user -s "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$identity" ]]; then
            echo "error: the p12 does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          if ! security find-identity -v -p codesigning | grep -F -q "$identity"; then
            echo "error: Developer ID is not visible in the default keychain search list." >&2
            security list-keychains -d user
            security default-keychain -d user
            security find-identity -v -p codesigning
            exit 1
          fi
          identity_team="$(sed -n 's/.*(\([^)]*\))$/\1/p' <<<"$identity")"
          if [[ -z "$identity_team" || "$APPLE_TEAM_ID" != "$identity_team" ]]; then
            echo "error: APPLE_TEAM_ID does not match the imported Developer ID team ${identity_team:-unknown}." >&2
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "error: APPLE_API_ISSUER must be the App Store Connect Issuer ID (a UUID), not the Team ID or Key ID." >&2
            exit 1
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$api_key_path"; then
            echo "error: APPLE_API_KEY_P8 does not look like an AuthKey .p8 PEM. Set it from the file, not a paste that lost newlines." >&2
            exit 1
          fi
          if ! xcrun notarytool history \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json >/dev/null; then
            echo "error: notarytool rejected APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER (401 or similar). They must be the matching Team key from App Store Connect, signed in as the paid account." >&2
            exit 1
          fi

          echo "enabled=1" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"
          echo "### Release signing" >> "$GITHUB_STEP_SUMMARY"
          echo "Built with Developer ID signing, Apple notarization, and stapling." >> "$GITHUB_STEP_SUMMARY"

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          CODESIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain_path }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: ${{ steps.signing.outputs.enabled }}
          NOTARYTOOL_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          NOTARYTOOL_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/make-dmg.sh

      - name: Checksum DMG
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperLocal-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
        run: |
          if [[ -n "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$CERTIFICATE_PATH"
          if [[ -n "$API_KEY_PATH" ]]; then
            rm -f "$API_KEY_PATH"
          fi

      - name: Publish GitHub Release
        if: github.repository == 'usingcolor/WhisperLocal' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          signing="${RUNNER_TEMP}/signing-section.md"

          # Generated from what this build actually did, so the notes can never
          # claim a signing state the artifact does not have.
          if [[ "${SIGNED:-0}" == "1" ]]; then
            cat > "$signing" <<'SIGNED_EOF'
          This DMG is Developer ID signed, Apple-notarized, and stapled, so it opens normally under Gatekeeper.
          SIGNED_EOF
          else
            cat > "$signing" <<'ADHOC_EOF'
          This DMG is ad-hoc signed and **not** Apple-notarized, so macOS blocks the first launch. That is expected: notarization needs the $99/year Apple Developer Program, which this project does not pay for.

          To open it: **System Settings → Privacy & Security → Security → Open Anyway**. Right-click → Open no longer works on macOS 15+. If macOS instead says the app is "damaged", clear the quarantine flag:

              xattr -dr com.apple.quarantine /Applications/WhisperLocal.app

          Prefer not to bypass Gatekeeper? Build from source — a locally built app is never quarantined. See the README.

          Verify your download against `SHA256SUMS`, published with this release.
          ADHOC_EOF
          fi

          python3 - "$signing" > "$notes" <<'PY_EOF'
          import pathlib, sys
          body = pathlib.Path(".github/release-notes.md").read_text()
          section = pathlib.Path(sys.argv[1]).read_text().strip()
          token = "{{SIGNING_SECTION}}"
          if token not in body:
              sys.exit("error: release-notes.md is missing the " + token + " placeholder")
          sys.stdout.write(body.replace(token, section))
          PY_EOF

          gh release create "$tag" dist/*.dmg dist/SHA256SUMS \
            --title "WhisperLocal ${version}" \
            --notes-file "$notes"
